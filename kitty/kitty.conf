#--- fonts ---#
# font_family HurmitNerdFontMono
# font_family Comic Mono
# font_family UndefinedMedium
font_family GohuFont14NerdFontMono

font_size 12

bold_italic_font auto
italic_font auto
bold_font auto

#--- editor ---#
editor nvim

#--- cursor ---#
cursor_shape block
cursor_trail 2

#--- window ---#
window_padding_width 2 1 2 1

#--- opacity ---#
background_opacity    0.80

#--- colors ---#
include icecream.conf

#--- audio bell ---#
enable_audio_bell no
