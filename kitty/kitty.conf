#--- fonts ---#
# font_family HurmitNerdFontMono
# font_family Comic Mono
font_family UndefinedMedium
# font_family TerminessNerdFontMono
# font_family GohuFont14NerdFontMono

font_size 11
# modify_font cell_width 118%

bold_italic_font auto
italic_font auto
bold_font auto

#--- editor ---#
editor nvim

#--- cursor ---#
cursor_shape block
cursor_trail 2

#--- window ---#
window_padding_width 2 1 2 2

#--- opacity ---#
background_opacity    0.94

#--- colors ---#
# include icecream.conf
include 1159.conf

#--- audio bell ---#
enable_audio_bell no
